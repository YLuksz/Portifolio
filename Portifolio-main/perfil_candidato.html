<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Candidato</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1dd1a1 0%, #10ac84 100%);
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #1dd1a1, #00d2d3);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(16, 172, 132, 0.3);
        }
        .header-title { color: white; font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
        .home-icon {
            width: 40px; height: 40px; background: rgba(255,255,255,0.2); border-radius: 12px;
            display:flex; align-items:center; justify-content:center; cursor:pointer; backdrop-filter: blur(10px);
        }
        .home-icon::before { content: "🏠"; font-size:18px; }

        .main-content { padding: 40px 20px; max-width: 1200px; margin: 0 auto; }

        .profile-card {
            background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
            border-radius: 24px; padding: 32px; margin-bottom: 24px;
            box-shadow: 0 20px 40px rgba(16,172,132,0.2); border: 1px solid rgba(255,255,255,0.3);
            animation: slideInUp 0.6s ease-out;
            display:flex; align-items:center; gap:24px;
        }
        @keyframes slideInUp { from { opacity:0; transform:translateY(40px); } to { opacity:1; transform:translateY(0); } }

        .avatar { width:80px; height:80px; background: linear-gradient(135deg,#1dd1a1,#10ac84); border-radius:20px;
                 display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(29,209,161,0.4); }
        .avatar::before { content:"👤"; font-size:32px; filter:brightness(0) invert(1); }

        .profile-info { flex:1; }
        .user-name { font-size:24px; font-weight:700; color:#2c3e50; margin-bottom:4px; }
        .user-role { font-size:16px; color:#7f8c8d; margin-bottom:8px; }
        .contact-info { font-size:14px; color:#10ac84; font-weight:500; }

        /* editable inputs */
        .inline-input {
            width:100%;
            padding:8px 12px;
            border-radius:10px;
            border:1px solid rgba(0,0,0,0.06);
            font-size:16px;
            background: transparent;
            color: #2c3e50;
        }
        .inline-input[readonly] { background: transparent; color: #2c3e50; opacity: 0.85; }

        .customize-btn {
            background: linear-gradient(135deg, #1dd1a1, #10ac84);
            color: white; border: none; padding: 12px 24px; border-radius: 12px;
            font-weight: 600; cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(29, 209, 161, 0.4);
        }
        .customize-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(29,209,161,0.6); }

        .nav-tabs {
            display:flex; background: rgba(255,255,255,0.9); backdrop-filter: blur(20px);
            border-radius:16px; padding:8px; margin-bottom:24px; gap:4px;
            box-shadow:0 8px 24px rgba(16,172,132,0.15); border:1px solid rgba(255,255,255,0.3);
            animation: slideInUp 0.8s ease-out; overflow-x:auto;
        }
        .nav-tab {
            flex:1; min-width:120px; background:transparent; border:none; padding:16px 20px;
            border-radius:12px; cursor:pointer; font-weight:500; font-size:14px; color:#7f8c8d;
            transition:all 0.3s ease; text-align:center; white-space:nowrap;
        }
        .nav-tab.active { background: linear-gradient(135deg,#1dd1a1,#10ac84); color:white; box-shadow:0 4px 12px rgba(29,209,161,0.4); transform:translateY(-1px); }
        .nav-tab:hover:not(.active) { background: rgba(29,209,161,0.1); color:#10ac84; }

        .content-area {
            background: rgba(255,255,255,0.9); backdrop-filter: blur(20px); border-radius:20px;
            padding: 24px; box-shadow: 0 16px 32px rgba(16,172,132,0.15); border:1px solid rgba(255,255,255,0.3);
            animation: fadeIn 0.6s ease-out; min-height:200px;
        }
        @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }

        /* textarea style */
        #contentText {
            width:100%; min-height:220px; resize:vertical; border-radius:12px; padding:16px;
            border:1px solid rgba(0,0,0,0.08); font-size:15px; line-height:1.4; color:#2c3e50;
            background: white;
        }
        #contentText[readonly] { background: rgba(255,255,255,0.95); outline: none; }
        .meta-note { font-size:12px; color:#7f8c8d; margin-top:8px; }

        @media (max-width:768px) {
            .profile-card { flex-direction:column; text-align:center; gap:16px; }
            .avatar { width:64px; height:64px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1 class="header-title">Perfil de candidato</h1>
        <button class="home-icon" title="Voltar para home" onclick="location.href='home.html'"></button>
    </header>

    <main class="main-content">
        <div class="profile-card">
            <div class="avatar"></div>
            <div class="profile-info">
                <!-- agora inputs editáveis controlados por JS -->
                <input id="nameInput" class="inline-input user-name" type="text" readonly />
                <p class="user-role">Candidato</p>
                <input id="emailInput" class="inline-input contact-info" type="email" readonly />
            </div>
            <button id="customizeBtn" class="customize-btn">Costumizar</button>
        </div>

        <nav class="nav-tabs" id="tabs">
            <button class="nav-tab active" data-key="experiencia">experiência</button>
            <button class="nav-tab" data-key="certificacoes">certificações</button>
            <button class="nav-tab" data-key="habilidades">habilidades</button>
            <button class="nav-tab" data-key="dados_pessoais">dados pessoais</button>
            <button class="nav-tab" data-key="experiencia_profissional">experiência profissional</button>
        </nav>

        <div class="content-area">
            <textarea id="contentText" readonly></textarea>
            <div class="meta-note" id="metaNote">Clique em "Costumizar" para editar esta seção.</div>
        </div>
    </main>
    
    <!-- Firebase SDK (compatível com a versão usada em outros arquivos) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <!-- arquivo local com config (já existe no projeto) -->
    <script src="firebase.js"></script>

    <script>
        // chaves e textos padrão
        const defaults = {
            experiencia: "Descreva sua experiência aqui...",
            certificacoes: "Liste suas certificações aqui...",
            habilidades: "Adicione suas habilidades aqui...",
            dados_pessoais: "Adicione seus dados pessoais aqui (endereço, telefone, etc.)...",
            experiencia_profissional: "Detalhe sua experiência profissional (empresas, cargos, períodos)..."
        };

        const tabs = document.querySelectorAll('.nav-tab');
        const textarea = document.getElementById('contentText');
        const customizeBtn = document.getElementById('customizeBtn');
        const metaNote = document.getElementById('metaNote');
        const nameInput = document.getElementById('nameInput');
        const emailInput = document.getElementById('emailInput');

        // estado
        let currentKey = document.querySelector('.nav-tab.active').dataset.key;
        let editing = false;

        function storageKey(k) { return `perfil_candidato_${k}`; }

        // ID persistente do usuário (gera uma única vez e salva em localStorage)
        function getOrCreateUserId() {
            let id = localStorage.getItem('pf_user_id');
            if (!id) {
                id = 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2,9);
                localStorage.setItem('pf_user_id', id);
            }
            return id;
        }

        // chave base para gravar no Realtime DB usando um id persistente
        function dbKey() {
            return 'perfil_candidato/' + getOrCreateUserId();
        }

        function loadProfileInfo() {
            // tenta usar localStorage.user (salvo no cadastro) ou chaves individuais
            const userRaw = localStorage.getItem('user');
            if (userRaw) {
                try {
                    const u = JSON.parse(userRaw);
                    nameInput.value = u.username || u.name || u.companyName || '';
                    emailInput.value = u.email || '';
                } catch {
                    nameInput.value = '';
                    emailInput.value = '';
                }
            } else {
                nameInput.value = localStorage.getItem(storageKey('nome')) || 'Nome do usuário';
                emailInput.value = localStorage.getItem(storageKey('email')) || 'contato@exemplo.com';
            }
            // keep inputs readonly by default
            nameInput.setAttribute('readonly', '');
            emailInput.setAttribute('readonly', '');
        }

        function loadContent(key) {
            // tenta carregar do Realtime DB primeiro, depois fallback para localStorage/defaults
            try {
                const path = dbKey() + '/sections/' + key;
                db.ref(path).once('value').then(snap => {
                    const val = snap.val();
                    if (val && typeof val.text === 'string') {
                        textarea.value = val.text;
                    } else {
                        const stored = localStorage.getItem(storageKey(key));
                        textarea.value = stored !== null ? stored : (defaults[key] || '');
                    }
                    textarea.scrollTop = 0;
                }).catch(() => {
                    const stored = localStorage.getItem(storageKey(key));
                    textarea.value = stored !== null ? stored : (defaults[key] || '');
                    textarea.scrollTop = 0;
                }).finally(() => {
                    textarea.setAttribute('readonly', ''); // sempre carregar como readonly
                    editing = false;
                    customizeBtn.textContent = 'Costumizar';
                    metaNote.textContent = 'Clique em "Costumizar" para editar esta seção.';
                    // ensure profile inputs also reset to readonly
                    nameInput.setAttribute('readonly', '');
                    emailInput.setAttribute('readonly', '');
                });
            } catch (e) {
                const stored = localStorage.getItem(storageKey(key));
                textarea.value = stored !== null ? stored : (defaults[key] || '');
                textarea.scrollTop = 0;
                textarea.setAttribute('readonly', ''); // sempre carregar como readonly
                editing = false;
                customizeBtn.textContent = 'Costumizar';
                metaNote.textContent = 'Clique em "Costumizar" para editar esta seção.';
                // ensure profile inputs also reset to readonly
                nameInput.setAttribute('readonly', '');
                emailInput.setAttribute('readonly', '');
            }
        }

        function saveContent(key) {
            localStorage.setItem(storageKey(key), textarea.value);
            // grava também no Realtime DB
            try {
                const path = dbKey() + '/sections/' + key;
                db.ref(path).set({ text: textarea.value, updatedAt: Date.now() });
            } catch (e) {
                console.warn('Não foi possível salvar no Firebase:', e);
            }
        }

        function saveProfileInfo() {
            localStorage.setItem(storageKey('nome'), nameInput.value);
            localStorage.setItem(storageKey('email'), emailInput.value);
            // também atualiza the generic 'user' localStorage (preserve structure)
            try {
                const existing = JSON.parse(localStorage.getItem('user') || '{}');
                existing.username = nameInput.value;
                existing.email = emailInput.value;
                localStorage.setItem('user', JSON.stringify(existing));
            } catch {
                localStorage.setItem('user', JSON.stringify({ username: nameInput.value, email: emailInput.value }));
            }
            // grava perfil no Firebase
            try {
                const path = dbKey() + '/profile';
                db.ref(path).set({ name: nameInput.value, email: emailInput.value, updatedAt: Date.now() });
            } catch (e) {
                console.warn('Não foi possível salvar perfil no Firebase:', e);
            }
        }

        // inicializa conteúdo e infos
        loadProfileInfo();
        loadContent(currentKey);

        // tab click
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentKey = tab.dataset.key;
                loadContent(currentKey);
            });
        });

        // botão customizar / salvar
        customizeBtn.addEventListener('click', () => {
            if (!editing) {
                // entrar em modo edição (habilita textarea e inputs)
                textarea.removeAttribute('readonly');
                nameInput.removeAttribute('readonly');
                emailInput.removeAttribute('readonly');
                // focus onde for apropriado
                textarea.focus();
                customizeBtn.textContent = 'Salvar';
                metaNote.textContent = 'Edição habilitada — clique em Salvar para guardar as mudanças.';
                editing = true;
            } else {
                // salvar e sair do modo edição
                textarea.setAttribute('readonly', '');
                nameInput.setAttribute('readonly', '');
                emailInput.setAttribute('readonly', '');
                saveContent(currentKey);
                saveProfileInfo();
                customizeBtn.textContent = 'Costumizar';
                metaNote.textContent = 'Alterações salvas.';
                editing = false;
                setTimeout(() => { metaNote.textContent = 'Clique em "Costumizar" para editar esta seção.'; }, 2000);
            }
        });

        // Ctrl+S salva quando em edição (salva textarea e inputs)
        window.addEventListener('keydown', (e) => {
            if (editing && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                textarea.setAttribute('readonly', '');
                nameInput.setAttribute('readonly', '');
                emailInput.setAttribute('readonly', '');
                saveContent(currentKey);
                saveProfileInfo();
                customizeBtn.textContent = 'Costumizar';
                metaNote.textContent = 'Alterações salvas (atalho).';
                editing = false;
                setTimeout(() => { metaNote.textContent = 'Clique em "Costumizar" para editar esta seção.'; }, 2000);
            }
        });
    </script>
</body>
</html>
