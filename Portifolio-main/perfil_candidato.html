<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil de Candidato</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto, sans-serif;
            background:linear-gradient(135deg,#1dd1a1 0%,#10ac84 100%);min-height:100vh}
        .header{background:linear-gradient(135deg,#1dd1a1,#00d2d3);padding:16px 20px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 20px rgba(16,172,132,0.3)}
        .header-title{color:#fff;font-size:20px;font-weight:600}
        .home-icon{width:40px;height:40px;background:rgba(255,255,255,0.18);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
        .home-icon::before{content:"🏠";font-size:18px}
        .main-content{padding:40px 20px;max-width:1200px;margin:0 auto}
        .profile-card{background:rgba(255,255,255,0.95);backdrop-filter:blur(12px);border-radius:20px;padding:28px;margin-bottom:20px;display:flex;gap:20px;align-items:center;box-shadow:0 16px 32px rgba(16,172,132,0.12)}
        .avatar{width:84px;height:84px;border-radius:18px;background:linear-gradient(135deg,#1dd1a1,#10ac84);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,0.06)}
        .avatar::before{content:"👤";font-size:36px;color:#fff}
        .profile-info{flex:1}
        .inline-input{width:100%;padding:8px 12px;border-radius:10px;border:1px solid rgba(0,0,0,0.06);font-size:16px;background:transparent;color:#2c3e50}
        .inline-input[readonly]{opacity:0.9;background:transparent}
        .customize-btn{background:linear-gradient(135deg,#1dd1a1,#10ac84);color:#fff;border:none;padding:12px 20px;border-radius:12px;cursor:pointer;font-weight:600;box-shadow:0 6px 18px rgba(29,209,161,0.2)}
        .nav-tabs{display:flex;gap:8px;margin-bottom:18px;padding:8px;border-radius:14px;background:rgba(255,255,255,0.92);box-shadow:0 8px 24px rgba(16,172,132,0.08);overflow-x:auto}
        .nav-tab{min-width:140px;padding:12px 18px;border-radius:12px;border:none;background:transparent;cursor:pointer;color:#6b7a6f;font-weight:600;text-align:center}
        .nav-tab.active{background:linear-gradient(135deg,#1dd1a1,#10ac84);color:#fff;transform:translateY(-2px)}
        .content-area{background:rgba(255,255,255,0.95);padding:20px;border-radius:14px;box-shadow:0 14px 28px rgba(16,172,132,0.08)}
        #contentText{width:100%;min-height:220px;resize:vertical;padding:16px;border-radius:12px;border:1px solid rgba(0,0,0,0.06);font-size:15px;color:#2c3e50;background:white}
        #contentText[readonly]{background:rgba(255,255,255,0.98)}
        .meta-note{margin-top:10px;font-size:13px;color:#7f8c8d}
        @media(max-width:768px){.profile-card{flex-direction:column;text-align:center}.avatar{width:64px;height:64px}.nav-tab{min-width:110px}}
    </style>
</head>
<body>
    <header class="header">
        <div class="header-title">Perfil de candidato</div>
        <button class="home-icon" title="Voltar para home" onclick="location.href='home.html'"></button>
    </header>

    <main class="main-content">
        <div class="profile-card">
            <div class="avatar"></div>
            <div class="profile-info">
                <input id="nameInput" class="inline-input" type="text" readonly placeholder="Nome do usuário" />
                <div style="height:8px"></div>
                <input id="emailInput" class="inline-input" type="email" readonly placeholder="contato@exemplo.com" />
                <div style="height:8px"></div>
                <div style="color:#7f8c8d;font-size:14px;margin-top:6px">Candidato</div>
            </div>
            <div>
                <button id="customizeBtn" class="customize-btn">Costumizar</button>
            </div>
        </div>

        <nav class="nav-tabs" id="tabs">
            <button class="nav-tab active" data-key="experiencia">experiência</button>
            <button class="nav-tab" data-key="certificacoes">certificações</button>
            <button class="nav-tab" data-key="habilidades">habilidades</button>
            <button class="nav-tab" data-key="dados_pessoais">dados pessoais</button>
            <button class="nav-tab" data-key="experiencia_profissional">experiência profissional</button>
        </nav>

        <div class="content-area">
            <textarea id="contentText" readonly></textarea>
            <div class="meta-note" id="metaNote">Clique em "Costumizar" para editar esta seção.</div>
        </div>
    </main>

    <!-- Firebase (se já incluido globalmente em outro arquivo, ok) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <script src="firebase.js"></script>

    <script>
    (function(){
        // fallback para db se firebase foi inicializado em firebase.js
        const db = (typeof firebase !== 'undefined' && firebase.database) ? firebase.database() : undefined;

        const defaults = {
            experiencia: "Descreva sua experiência aqui...",
            certificacoes: "Liste suas certificações aqui...",
            habilidades: "Adicione suas habilidades aqui...",
            dados_pessoais: "Adicione seus dados pessoais aqui (endereço, telefone, etc.)...",
            experiencia_profissional: "Detalhe sua experiência profissional (empresas, cargos, períodos)..."
        };

        const tabs = Array.from(document.querySelectorAll('.nav-tab'));
        const textarea = document.getElementById('contentText');
        const customizeBtn = document.getElementById('customizeBtn');
        const metaNote = document.getElementById('metaNote');
        const nameInput = document.getElementById('nameInput');
        const emailInput = document.getElementById('emailInput');

        let currentKey = document.querySelector('.nav-tab.active').dataset.key || 'experiencia';
        let editing = false;

        function storageKey(k){ return `perfil_candidato_${k}`; }
        function localUser(){ try{return JSON.parse(localStorage.getItem('user')||'{}')}catch{return{}}}

        function normalizeEmail(e){ return String(e||'').trim().toLowerCase(); }

        function getOrCreateCandidateId(){
            let id = localStorage.getItem('pf_candidate_id');
            if(!id){
                id = 'c_'+Date.now()+'_'+Math.random().toString(36).slice(2,9);
                localStorage.setItem('pf_candidate_id', id);
            }
            return id;
        }

        async function resolveIdByEmail(email){
            if(!email || !db) return null;
            const e = normalizeEmail(email);
            try{
                const mapSnap = await db.ref('users_by_email/' + encodeURIComponent(e)).once('value');
                const mapped = mapSnap.val();
                if(mapped) return mapped;
            }catch(e){/*ignore*/}
            try{
                const snap = await db.ref('candidatos').orderByChild('email').equalTo(email).once('value');
                let key = null;
                snap.forEach(child=>{ key = child.key; });
                if(key) return key;
            }catch(e){/*ignore*/}
            return null;
        }

        function dbKey(){
            const id = localStorage.getItem('pf_candidate_id') || getOrCreateCandidateId();
            return 'perfil_candidato/' + id;
        }

        async function loadProfileInfo(){
            // 1) preenche com localStorage.user se existir
            const u = localUser();
            if(u && (u.username || u.name || u.email || u.email)) {
                nameInput.value = u.username || u.name || '';
                emailInput.value = u.email || '';
            } else {
                nameInput.value = localStorage.getItem(storageKey('nome')) || 'Nome do usuário';
                emailInput.value = localStorage.getItem(storageKey('email')) || 'contato@exemplo.com';
            }
            nameInput.setAttribute('readonly','');
            emailInput.setAttribute('readonly','');

            // 2) se existir db, tenta resolver id pelo email e carregar o profile salvo no DB (prioriza o DB salvo mais recente)
            const email = emailInput.value && normalizeEmail(emailInput.value);
            if(email && db){
                try{
                    const resolved = await resolveIdByEmail(email);
                    if(resolved){
                        localStorage.setItem('pf_candidate_id', resolved);
                    }
                    // tenta carregar profile salvo no nó perfil_candidato/<id>/profile
                    const idToUse = localStorage.getItem('pf_candidate_id');
                    if(idToUse){
                        const pSnap = await db.ref('perfil_candidato/' + idToUse + '/profile').once('value');
                        if(pSnap.exists()){
                            const p = pSnap.val();
                            if(p.name) nameInput.value = p.name;
                            if(p.email) emailInput.value = p.email;
                        }
                    }
                }catch(err){
                    console.warn('Erro ao resolver/ler profile do DB:', err);
                }
            }
        }

        async function loadContent(key){
            // tenta carregar do perfil_candidato/<id>/sections/<key> no DB
            try{
                if(db){
                    const id = localStorage.getItem('pf_candidate_id') || null;
                    if(id){
                        const snap = await db.ref('perfil_candidato/' + id + '/sections/' + key).once('value');
                        const val = snap.val();
                        if(val && typeof val.text === 'string'){
                            textarea.value = val.text;
                        } else if(val && typeof val === 'string'){
                            textarea.value = val;
                        } else {
                            // fallback para "candidatos" nó (bio/campo)
                            const cSnap = await db.ref('candidatos/' + id).once('value');
                            if(cSnap.exists()){
                                const cVal = cSnap.val();
                                textarea.value = cVal.bio || cVal.username || localStorage.getItem(storageKey(key)) || defaults[key] || '';
                            } else {
                                textarea.value = localStorage.getItem(storageKey(key)) || defaults[key] || '';
                            }
                        }
                    } else {
                        textarea.value = localStorage.getItem(storageKey(key)) || defaults[key] || '';
                    }
                } else {
                    textarea.value = localStorage.getItem(storageKey(key)) || defaults[key] || '';
                }
            }catch(err){
                console.warn('Erro ao carregar seção do DB, usando local:', err);
                textarea.value = localStorage.getItem(storageKey(key)) || defaults[key] || '';
            } finally {
                textarea.scrollTop = 0;
                textarea.setAttribute('readonly','');
                editing = false;
                customizeBtn.textContent = 'Costumizar';
                metaNote.textContent = 'Clique em "Costumizar" para editar esta seção.';
                nameInput.setAttribute('readonly','');
                emailInput.setAttribute('readonly','');
            }
        }

        async function saveProfileInfo(){
            // salva local
            localStorage.setItem(storageKey('nome'), nameInput.value);
            localStorage.setItem(storageKey('email'), emailInput.value);
            try{
                const existing = JSON.parse(localStorage.getItem('user')||'{}');
                existing.username = nameInput.value;
                existing.email = emailInput.value;
                localStorage.setItem('user', JSON.stringify(existing));
            }catch(e){ localStorage.setItem('user', JSON.stringify({ username: nameInput.value, email: emailInput.value })); }

            // salva no DB
            try{
                const email = normalizeEmail(emailInput.value);
                let id = localStorage.getItem('pf_candidate_id') || null;
                if(email && db){
                    const resolved = await resolveIdByEmail(email);
                    if(resolved) id = resolved;
                }
                if(!id) id = getOrCreateCandidateId();
                localStorage.setItem('pf_candidate_id', id);

                if(db){
                    // grava profile
                    await db.ref('perfil_candidato/' + id + '/profile').set({ name: nameInput.value, email: emailInput.value, updatedAt: Date.now() });
                    // grava mapeamento email -> id para consistência
                    if(email) await db.ref('users_by_email/' + encodeURIComponent(email)).set(id);
                    // grava a seção atual (textarea) como backup
                    await db.ref('perfil_candidato/' + id + '/sections/' + currentKey).set({ text: textarea.value, updatedAt: Date.now() });
                }
            }catch(err){
                console.warn('Erro ao salvar no DB:', err);
            }
        }

        function saveContentLocal(key){
            localStorage.setItem(storageKey(key), textarea.value);
        }

        // UI bindings
        tabs.forEach(tab=>{
            tab.addEventListener('click', async ()=>{
                tabs.forEach(t=>t.classList.remove('active'));
                tab.classList.add('active');
                currentKey = tab.dataset.key;
                await loadContent(currentKey);
            });
        });

        customizeBtn.addEventListener('click', async ()=>{
            if(!editing){
                textarea.removeAttribute('readonly');
                nameInput.removeAttribute('readonly');
                emailInput.removeAttribute('readonly');
                textarea.focus();
                customizeBtn.textContent = 'Salvar';
                metaNote.textContent = 'Edição habilitada — clique em Salvar para guardar as mudanças.';
                editing = true;
            } else {
                textarea.setAttribute('readonly','');
                nameInput.setAttribute('readonly','');
                emailInput.setAttribute('readonly','');
                // salva local e no DB
                saveContentLocal(currentKey);
                await saveProfileInfo();
                customizeBtn.textContent = 'Costumizar';
                metaNote.textContent = 'Alterações salvas.';
                editing = false;
                setTimeout(()=>{ metaNote.textContent = 'Clique em "Costumizar" para editar esta seção.'; }, 1800);
            }
        });

        // Ctrl+S while editing
        window.addEventListener('keydown', async (e)=>{
            if(editing && (e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){
                e.preventDefault();
                textarea.setAttribute('readonly','');
                nameInput.setAttribute('readonly','');
                emailInput.setAttribute('readonly','');
                saveContentLocal(currentKey);
                await saveProfileInfo();
                customizeBtn.textContent = 'Costumizar';
                metaNote.textContent = 'Alterações salvas (atalho).';
                editing = false;
                setTimeout(()=>{ metaNote.textContent = 'Clique em "Costumizar" para editar esta seção.'; }, 1800);
            }
        });

        // inicialização
        (async function init(){
            try{ await loadProfileInfo(); }catch(e){ console.warn(e); }
            try{ await loadContent(currentKey); }catch(e){ console.warn(e); }
        })();

    })();
    </script>
</body>
</html>
