<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Perfil de Empregador</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg,#1dd1a1 0%,#10ac84 100%);
            min-height:100vh;
        }
        .header {
            background: linear-gradient(135deg,#1dd1a1,#00d2d3);
            padding:16px 20px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            box-shadow:0 4px 20px rgba(16,172,132,0.3);
        }
        .header-title { color:#fff; font-size:20px; font-weight:600; }
        .home-icon {
            width:40px; height:40px; background:rgba(255,255,255,0.18); border-radius:12px;
            display:flex; align-items:center; justify-content:center; cursor:pointer;
        }
        .home-icon::before { content:"🏠"; font-size:18px; }

        .main-content { padding:40px 20px; max-width:1200px; margin:0 auto; }

        .profile-card {
            background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
            border-radius:20px; padding:28px; margin-bottom:20px;
            display:flex; gap:20px; align-items:center; box-shadow:0 16px 32px rgba(16,172,132,0.12);
        }

        .avatar {
            width:84px; height:84px; border-radius:18px;
            background:linear-gradient(135deg,#ff9f43,#ff6b6b);
            display:flex; align-items:center; justify-content:center; box-shadow:0 8px 24px rgba(0,0,0,0.08);
        }
        .avatar::before { content:"🏢"; font-size:36px; color:#fff; }

        .profile-info { flex:1; }
        .inline-input {
            width:100%; padding:8px 12px; border-radius:10px; border:1px solid rgba(0,0,0,0.06);
            font-size:16px; background:transparent; color:#2c3e50;
        }
        .inline-input[readonly] { opacity:0.9; background:transparent; }

        .customize-btn {
            background: linear-gradient(135deg,#1dd1a1,#10ac84);
            color:#fff; border:none; padding:12px 20px; border-radius:12px; cursor:pointer; font-weight:600;
            box-shadow:0 6px 18px rgba(29,209,161,0.2);
        }

        .nav-tabs {
            display:flex; gap:8px; margin-bottom:18px; padding:8px; border-radius:14px;
            background: rgba(255,255,255,0.92); box-shadow:0 8px 24px rgba(16,172,132,0.08); overflow-x:auto;
        }
        .nav-tab {
            min-width:140px; padding:12px 18px; border-radius:12px; border:none; background:transparent;
            cursor:pointer; color:#6b7a6f; font-weight:600; text-align:center;
        }
        .nav-tab.active { background:linear-gradient(135deg,#1dd1a1,#10ac84); color:#fff; transform:translateY(-2px); }

        .content-area {
            background: rgba(255,255,255,0.95); padding:20px; border-radius:14px;
            box-shadow:0 14px 28px rgba(16,172,132,0.08);
        }

        #contentText {
            width:100%; min-height:220px; resize:vertical; padding:16px; border-radius:12px;
            border:1px solid rgba(0,0,0,0.06); font-size:15px; color:#2c3e50; background:white;
        }
        #contentText[readonly] { background: rgba(255,255,255,0.98); }

        .meta-note { margin-top:10px; font-size:13px; color:#7f8c8d; }

        @media (max-width:768px) {
            .profile-card { flex-direction:column; text-align:center; }
            .avatar { width:64px; height:64px; }
            .nav-tab { min-width:110px; }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-title">Perfil de Empregador</div>
        <button class="home-icon" title="Voltar para home" onclick="location.href='home.html'"></button>
    </header>

    <main class="main-content">
        <div class="profile-card">
            <div class="avatar"></div>
            <div class="profile-info">
                <!-- Inputs controlados por JS -->
                <input id="companyNameInput" class="inline-input" type="text" readonly placeholder="Nome da empresa" />
                <div style="height:8px"></div>
                <input id="emailInput" class="inline-input" type="email" readonly placeholder="email@empresa.com" />
                <div style="height:8px"></div>
                <div style="color:#7f8c8d; font-size:14px; margin-top:6px;">Empregador</div>
            </div>
            <div>
                <button id="customizeBtn" class="customize-btn">Costumizar</button>
            </div>
        </div>

        <nav class="nav-tabs" id="tabs">
            <button class="nav-tab active" data-key="sobre_empresa">sobre a empresa</button>
            <button class="nav-tab" data-key="vagas">vagas abertas</button>
            <button class="nav-tab" data-key="equipe">equipe</button>
            <button class="nav-tab" data-key="contatos">contatos</button>
            <button class="nav-tab" data-key="historia">história</button>
        </nav>

        <div class="content-area">
            <textarea id="contentText" readonly></textarea>
            <div class="meta-note" id="metaNote">Clique em "Costumizar" para editar esta seção.</div>
        </div>
    </main>

    <!-- Firebase SDK (compatível com a versão usada em outros arquivos) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <!-- arquivo local com config (já existe no projeto) -->
    <script src="firebase.js"></script>

    <script>
        // textos padrão por aba
        const defaults = {
            sobre_empresa: "Descreva sua empresa: missão, valores e atuação...",
            vagas: "Liste as vagas abertas e requisitos (título, local, tipo, descrição)...",
            equipe: "Apresente sua equipe e cargos principais...",
            contatos: "Endereço, telefone, site e redes sociais da empresa...",
            historia: "Breve história da empresa, marcos e prêmios..."
        };

        const tabs = document.querySelectorAll('.nav-tab');
        const textarea = document.getElementById('contentText');
        const customizeBtn = document.getElementById('customizeBtn');
        const metaNote = document.getElementById('metaNote');
        const companyNameInput = document.getElementById('companyNameInput');
        const emailInput = document.getElementById('emailInput');

        let currentKey = document.querySelector('.nav-tab.active').dataset.key;
        let editing = false;

        function storageKey(k) { return `perfil_empregador_${k}`; }

        // ID persistente do EMPREGADOR (gera uma única vez e salva em localStorage)
        function getOrCreateEmployerId() {
            let id = localStorage.getItem('pf_employer_id');
            if (!id) {
                id = 'e_' + Date.now() + '_' + Math.random().toString(36).slice(2,9);
                localStorage.setItem('pf_employer_id', id);
            }
            return id;
        }

        // gera uma chave segura para usar no Realtime DB baseada no id do empregador
        function dbKey() {
            return 'perfil_empregador/' + getOrCreateEmployerId();
        }

        // carrega infos do perfil e tenta resolver um id existente pelo e-mail no DB
        function loadProfileInfo() {
            return new Promise((resolve) => {
                const userRaw = localStorage.getItem('user');
                if (userRaw) {
                    try {
                        const u = JSON.parse(userRaw);
                        companyNameInput.value = u.companyName || u.username || localStorage.getItem(storageKey('companyName')) || 'Nome da empresa';
                        emailInput.value = u.email || localStorage.getItem(storageKey('email')) || 'email@empresa.com';
                    } catch {
                        companyNameInput.value = localStorage.getItem(storageKey('companyName')) || 'Nome da empresa';
                        emailInput.value = localStorage.getItem(storageKey('email')) || 'email@empresa.com';
                    }
                } else {
                    companyNameInput.value = localStorage.getItem(storageKey('companyName')) || 'Nome da empresa';
                    emailInput.value = localStorage.getItem(storageKey('email')) || 'email@empresa.com';
                }
                companyNameInput.setAttribute('readonly', '');
                emailInput.setAttribute('readonly', '');

                const email = (emailInput.value || '').trim();
                if (email && typeof db !== 'undefined') {
                    const mapPath = 'users_by_email/' + encodeURIComponent(email);
                    db.ref(mapPath).once('value').then(snap => {
                        const mapped = snap.val();
                        if (mapped) {
                            localStorage.setItem('pf_employer_id', mapped);
                        }
                    }).catch(() => {
                        // ignore
                    }).finally(() => resolve());
                } else {
                    resolve();
                }
            });
        }

        function loadContent(key) {
            // primeiro tenta carregar do Realtime DB (por empresa/email)
            try {
                const path = dbKey() + '/sections/' + key;
                db.ref(path).once('value').then(snap => {
                    const val = snap.val();
                    if (val && typeof val.text === 'string') {
                        textarea.value = val.text;
                    } else {
                        const stored = localStorage.getItem(storageKey(key));
                        textarea.value = stored !== null ? stored : (defaults[key] || '');
                    }
                    textarea.scrollTop = 0;
                }).catch(() => {
                    // se falhar (ex: offline), usa localStorage/defaults
                    const stored = localStorage.getItem(storageKey(key));
                    textarea.value = stored !== null ? stored : (defaults[key] || '');
                    textarea.scrollTop = 0;
                }).finally(() => {
                    textarea.setAttribute('readonly', '');
                    editing = false;
                    customizeBtn.textContent = 'Costumizar';
                    metaNote.textContent = 'Clique em "Costumizar" para editar esta seção.';
                    companyNameInput.setAttribute('readonly', '');
                    emailInput.setAttribute('readonly', '');
                });
            } catch (e) {
                const stored = localStorage.getItem(storageKey(key));
                textarea.value = stored !== null ? stored : (defaults[key] || '');
                textarea.scrollTop = 0;
                textarea.setAttribute('readonly', '');
                editing = false;
                customizeBtn.textContent = 'Costumizar';
                metaNote.textContent = 'Clique em "Costumizar" para editar esta seção.';
                companyNameInput.setAttribute('readonly', '');
                emailInput.setAttribute('readonly', '');
            }
        }

        function saveContent(key) {
            localStorage.setItem(storageKey(key), textarea.value);
            // grava também no Realtime DB
            try {
                const path = dbKey() + '/sections/' + key;
                db.ref(path).set({ text: textarea.value, updatedAt: Date.now() });
            } catch (e) {
                console.warn('Não foi possível salvar no Firebase:', e);
            }
        }

        function saveProfileInfo() {
            localStorage.setItem(storageKey('companyName'), companyNameInput.value);
            localStorage.setItem(storageKey('email'), emailInput.value);
            try {
                const existing = JSON.parse(localStorage.getItem('user') || '{}');
                existing.companyName = companyNameInput.value;
                existing.email = emailInput.value;
                localStorage.setItem('user', JSON.stringify(existing));
            } catch {
                localStorage.setItem('user', JSON.stringify({ companyName: companyNameInput.value, email: emailInput.value }));
            }
            // grava perfil no Firebase
            try {
                const path = dbKey() + '/profile';
                db.ref(path).set({ companyName: companyNameInput.value, email: emailInput.value, updatedAt: Date.now() });
                // grava mapeamento email -> employer id para permitir login em outros dispositivos
                try {
                    const email = (emailInput.value || '').trim();
                    if (email) {
                        const mapPath = 'users_by_email/' + encodeURIComponent(email);
                        db.ref(mapPath).set(getOrCreateEmployerId());
                    }
                } catch (e) {
                    // ignore
                }
            } catch (e) {
                console.warn('Não foi possível salvar perfil no Firebase:', e);
            }
        }

    // init (aguarda possível mapeamento por e-mail antes de carregar o conteúdo)
    loadProfileInfo().then(() => loadContent(currentKey));

        // tabs
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentKey = tab.dataset.key;
                loadContent(currentKey);
            });
        });

        // customizar / salvar
        customizeBtn.addEventListener('click', () => {
            if (!editing) {
                textarea.removeAttribute('readonly');
                companyNameInput.removeAttribute('readonly');
                emailInput.removeAttribute('readonly');
                textarea.focus();
                customizeBtn.textContent = 'Salvar';
                metaNote.textContent = 'Edição habilitada — clique em Salvar para guardar as mudanças.';
                editing = true;
            } else {
                textarea.setAttribute('readonly', '');
                companyNameInput.setAttribute('readonly', '');
                emailInput.setAttribute('readonly', '');
                saveContent(currentKey);
                saveProfileInfo();
                customizeBtn.textContent = 'Costumizar';
                metaNote.textContent = 'Alterações salvas.';
                editing = false;
                setTimeout(()=>{ metaNote.textContent = 'Clique em "Costumizar" para editar esta seção.'; }, 1800);
            }
        });

        // Ctrl+S salva quando em edição
        window.addEventListener('keydown', (e) => {
            if (editing && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                e.preventDefault();
                textarea.setAttribute('readonly', '');
                companyNameInput.setAttribute('readonly', '');
                emailInput.setAttribute('readonly', '');
                saveContent(currentKey);
                saveProfileInfo();
                customizeBtn.textContent = 'Costumizar';
                metaNote.textContent = 'Alterações salvas (atalho).';
                editing = false;
                setTimeout(()=>{ metaNote.textContent = 'Clique em "Costumizar" para editar esta seção.'; }, 1800);
            }
        });
    </script>
</body>
</html>
